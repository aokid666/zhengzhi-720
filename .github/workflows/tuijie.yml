name: Validate Tuijie banks and lecture references
on:
  push:
    branches: [main, codex/tuijie-materials]
    paths: ['js/**', 'css/**', 'index.html', 'data/**', 'tests/**', '.github/workflows/tuijie.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false happy-dom@21.0.4 fake-indexeddb@6.2.6
      - run: node --test tests/*.test.cjs
      - run: node tests/practice-ui.mjs
      - run: node tests/test-mode-ui.mjs
      - run: node tests/tuijie-ui.mjs
      - run: node tests/lecture-race-ui.mjs
      - run: git diff --check
