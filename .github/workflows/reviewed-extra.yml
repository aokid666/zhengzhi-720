name: Verify reviewed extra lecture references
on:
  push:
    branches: [codex/question-copy]
    paths: ['scripts/apply-reviewed-extra.py', 'scripts/extra-reference-reviewed.json', '.github/workflows/reviewed-extra.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-reviewed-extra.py
      - name: Preserve verified references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/extra-links data/reviewed-extra-references-report.json
          git commit -m 'Link original handbook table to the scientific view of practice question'
          git push origin HEAD:codex/question-copy
