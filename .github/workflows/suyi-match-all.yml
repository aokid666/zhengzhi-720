name: Pair every bank with SuYi source facts
on:
  workflow_dispatch:
  push:
    branches: [codex/suyi-all-source-v148]
    paths: [scripts/suyi-match-all.py, .github/workflows/suyi-match-all.yml]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/suyi-match-all.py shard --index ${{ matrix.shard }} --count 8 --out shards/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: suyi-shard-${{ matrix.shard }}
          path: shards/*.json
          retention-days: 14
  assemble:
    needs: match
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: suyi-shard-*
          path: shards
          merge-multiple: true
      - name: Assemble source evidence and retain reviewed decisions
        run: |
          python scripts/suyi-match-all.py finalize --directory shards
          if [ -f scripts/suyi-additional-reviewed.json ]; then
            python scripts/apply-suyi-additional.py
            python scripts/package-suyi-audit.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: suyi-all-pairing-audit
          path: data/suyi-all-pairing-report.json
          retention-days: 30
      - name: Publish reviewable results branch
        run: |
          pairing_branch="codex/suyi-pairing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$pairing_branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/extra-links data/suyi-all-pairing-report.json
          if [ -f data/suyi-pairing-status.json ]; then git add data/suyi-pairing-status.json; fi
          git commit -m 'Audit all 4662 questions against SuYi with per-answer source coverage'
          git push origin "HEAD:refs/heads/$pairing_branch"
